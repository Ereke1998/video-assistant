<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Корабль — 2) Мел на доске</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d1d1d; }
  .stage { width: 360px; height: 640px; margin: 0 auto; position: relative; overflow: hidden;
    background: radial-gradient(ellipse at center, #3a5a48 0%, #2c4a39 70%, #223a2d 100%);
    border: 14px solid #8b5a2b; box-sizing: border-box; }
  .chalk { fill: none; stroke: #f4f4ef; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
    filter: url(#rough); stroke-dasharray: 600; stroke-dashoffset: 600;
    animation: draw 2.5s ease-out forwards; }
  .hull-line { animation-delay: 0.3s; }
  .label { font-family: "Segoe Print", "Comic Sans MS", cursive; fill: #f4f4ef; font-size: 16px;
    opacity: 0; animation: fade 0.6s ease-out 2.8s forwards; }
  .arrow { stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw 1s ease-out 3.4s forwards; }
  .ship-wrap { animation: float 3s ease-in-out 3.6s infinite; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) { .chalk, .label, .arrow, .ship-wrap { animation: none; stroke-dashoffset: 0; opacity: 1; } }
</style>
</head>
<body>
<div class="stage">
  <svg viewBox="0 0 340 620" width="100%" height="100%" aria-label="Корабль, мел на доске">
    <defs>
      <filter id="rough">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
      </filter>
    </defs>
    <g class="ship-wrap" transform="translate(40 200)">
      <path class="chalk" d="M20 90 L180 90 L162 118 L38 118 Z"/>
      <path class="chalk" d="M50 60 L150 60 L150 90 M50 60 L50 90"/>
      <path class="chalk" d="M70 42 L130 42 L130 60 M70 42 L70 60"/>
      <path class="chalk" d="M88 24 L100 24 L100 42 M88 24 L88 42 M112 24 L124 24 L124 42"/>
      <path class="chalk hull-line" d="M30 105 Q100 125 170 105" opacity="0.6"/>
    </g>
    <text class="label" x="30" y="90">КОРАБЛЬ 101</text>
    <text class="label" x="28" y="420">ТЯГА &gt; ВЕС</text>
    <path class="chalk arrow" d="M160 400 L160 330 M152 340 L160 330 L168 340"/>
    <text class="label" x="200" y="410" style="font-size:13px">тяга</text>
    <path class="chalk arrow" d="M60 470 L60 530 M52 520 L60 530 L68 520"/>
    <text class="label" x="72" y="520" style="font-size:13px">вес</text>
  </svg>
</div>
</body>
</html>
