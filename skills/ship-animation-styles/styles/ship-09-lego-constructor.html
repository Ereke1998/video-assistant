<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Корабль — 9) Конструктор</title>
<style>
  html, body { margin: 0; height: 100%; background: #9fd7f5; }
  .stage { width: 360px; height: 640px; margin: 0 auto; position: relative; overflow: hidden; background: #9fd7f5; }
  .plate { position: absolute; bottom: 0; width: 100%; height: 200px; background: #2f7fd1;
    background-image: radial-gradient(circle, #5aa6ea 0 6px, transparent 7px); background-size: 30px 30px; }
  .brick { position: absolute; border-radius: 3px; box-shadow: inset -4px -4px 0 rgba(0,0,0,0.18);
    opacity: 0; animation: snap 0.5s ease-out forwards; }
  .brick::before { content: ""; position: absolute; top: -6px; left: 0; right: 0; height: 6px; border-radius: 6px 6px 0 0;
    background: inherit; background-image: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.35) 0 5px, transparent 6px);
    background-size: 100% 6px; background-repeat: repeat-x; }
  .b1 { background: #d7372b; }
  .b2 { background: #ffd23f; }
  .b3 { background: #f5f5f5; }
  .b4 { background: #3aa84a; }
  .b5 { background: #2c2c3e; }
  @keyframes snap { from { opacity: 0; transform: translateY(-40px) scale(0.85); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .ship { position: absolute; left: 50%; top: 210px; width: 230px; margin-left: -115px;
    animation: lift 2.8s ease-in-out 2.4s infinite alternate; }
  @keyframes lift { from { transform: translateY(0); } to { transform: translateY(-10px); } }
  @media (prefers-reduced-motion: reduce) { .brick, .ship { animation: none; opacity: 1; } }
</style>
</head>
<body>
<div class="stage">
  <div class="plate"></div>
  <div class="brick b1" style="left:40px;top:300px;width:280px;height:28px;animation-delay:0.1s"></div>
  <div class="brick b2" style="left:60px;top:266px;width:240px;height:28px;animation-delay:0.4s"></div>
  <div class="brick b3" style="left:80px;top:232px;width:200px;height:28px;animation-delay:0.7s"></div>
  <div class="brick b4" style="left:110px;top:196px;width:60px;height:24px;animation-delay:1.0s"></div>
  <div class="brick b5" style="left:200px;top:196px;width:60px;height:24px;animation-delay:1.2s"></div>
  <div class="brick b2" style="left:120px;top:170px;width:140px;height:24px;animation-delay:1.4s"></div>
  <div class="brick b1" style="left:30px;top:120px;width:20px;height:50px;animation-delay:1.6s"></div>
  <svg class="ship" viewBox="0 0 200 120" aria-label="Корабль, конструктор" style="top:100px">
    <rect x="86" y="22" width="10" height="20" fill="#2c2c3e"/>
    <rect x="112" y="22" width="10" height="20" fill="#2c2c3e"/>
    <rect x="50" y="50" width="100" height="22" fill="#f5f5f5"/>
    <rect x="70" y="36" width="60" height="14" fill="#f5f5f5"/>
    <path d="M20 72 L180 72 L162 100 L38 100 Z" fill="#d7372b"/>
  </svg>
</div>
</body>
</html>
