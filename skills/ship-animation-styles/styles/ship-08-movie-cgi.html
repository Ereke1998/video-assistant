<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Корабль — 8) Кино-CGI</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070d; }
  .stage { width: 360px; height: 640px; margin: 0 auto; position: relative; overflow: hidden;
    background: radial-gradient(ellipse at 50% 60%, #2e3c57 0%, #0d1322 55%, #030409 100%); }
  .title { position: absolute; top: 40px; left: 0; right: 0; text-align: center; opacity: 0; animation: fadeUp 0.8s ease-out 0.4s forwards; }
  .title span { display: inline-block; background: #ffd23f; color: #000; font: 900 22px/1.2 Impact, "Arial Black", sans-serif;
    padding: 6px 12px; letter-spacing: 1px; }
  .ship-wrap { position: absolute; left: 50%; top: 210px; width: 260px; margin-left: -130px;
    animation: lift 3.6s cubic-bezier(.2,.7,.2,1) both, bob 3s ease-in-out 3.6s infinite; }
  .ship { width: 100%; height: auto; filter: drop-shadow(0 18px 14px rgba(0,0,0,0.6)); }
  .ship .hull { fill: url(#hullGrad); }
  .ship .cabin { fill: url(#cabinGrad); }
  .ship .funnel { fill: #1a1d24; }
  .rim { fill: none; stroke: #9ed8ff; stroke-width: 1.5; opacity: 0.7; }
  .glow { position: absolute; left: 50%; top: 330px; width: 300px; height: 40px; margin-left: -150px;
    background: radial-gradient(ellipse, rgba(255,160,80,0.5), transparent 70%); animation: pulse 3s ease-in-out infinite; }
  @keyframes lift { from { transform: translateY(160px) scale(0.92); } to { transform: translateY(0) scale(1); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .title, .ship-wrap, .glow { animation: none; opacity: 1; } }
</style>
</head>
<body>
<div class="stage">
  <div class="title"><span>А ЕСЛИ КОРАБЛЬ ВЗЛЕТИТ?</span></div>
  <div class="ship-wrap">
    <svg class="ship" viewBox="0 0 200 120" aria-label="Корабль, кино-CGI">
      <defs>
        <linearGradient id="hullGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e0463a"/><stop offset="1" stop-color="#7d1d18"/>
        </linearGradient>
        <linearGradient id="cabinGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9aa6b8"/>
        </linearGradient>
      </defs>
      <rect class="funnel" x="86" y="22" width="10" height="20"/>
      <rect class="funnel" x="112" y="22" width="10" height="20"/>
      <rect class="cabin" x="50" y="50" width="100" height="22"/>
      <rect class="cabin" x="70" y="36" width="60" height="14"/>
      <path class="hull" d="M20 72 L180 72 L162 100 L38 100 Z"/>
      <path class="rim" d="M20 72 L180 72"/>
    </svg>
  </div>
  <div class="glow"></div>
</div>
</body>
</html>
