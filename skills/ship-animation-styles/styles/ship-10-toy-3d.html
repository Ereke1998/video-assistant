<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Корабль — 10) Игрушечное 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #fde7ec; }
  .stage { width: 360px; height: 640px; margin: 0 auto; position: relative; overflow: hidden;
    background: linear-gradient(#cfe9ff 0%, #ffe9f1 70%); }
  .sea { position: absolute; bottom: 0; width: 100%; height: 190px;
    background: radial-gradient(ellipse at 50% 0%, #7fd6d0 0%, #4fb8b3 70%); border-radius: 50% 50% 0 0 / 30px 30px 0 0; }
  .cloud { position: absolute; width: 90px; height: 34px; background: #fff; border-radius: 40px; opacity: 0.9;
    animation: cloud 8s ease-in-out infinite alternate; }
  .cloud::before { content: ""; position: absolute; width: 44px; height: 44px; background: #fff; border-radius: 50%; left: 14px; top: -20px; }
  .ship-wrap { position: absolute; left: 50%; top: 230px; width: 230px; margin-left: -115px;
    animation: drop 2.2s cubic-bezier(.3,1.4,.5,1) both, bounce 2.4s ease-in-out 2.2s infinite; }
  .ship { width: 100%; height: auto; filter: drop-shadow(0 10px 0 rgba(0,0,0,0.12)); }
  .ship .hull { fill: url(#toyHull); }
  .ship .cabin { fill: url(#toyWhite); }
  .ship .funnel { fill: #ffb703; }
  .ship .window { fill: #3a86ff; }
  @keyframes drop { from { transform: translateY(-260px); } 60% { transform: translateY(12px) scaleY(0.92); } to { transform: translateY(0); } }
  @keyframes bounce { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-8px) scale(0.99, 1.02); } }
  @keyframes cloud { from { transform: translateX(-20px); } to { transform: translateX(30px); } }
  @media (prefers-reduced-motion: reduce) { .ship-wrap, .cloud { animation: none; } }
</style>
</head>
<body>
<div class="stage">
  <div class="cloud" style="left:30px;top:90px"></div>
  <div class="cloud" style="left:220px;top:140px;transform:scale(0.7)"></div>
  <div class="sea"></div>
  <div class="ship-wrap">
    <svg class="ship" viewBox="0 0 200 120" aria-label="Корабль, игрушечное 3D">
      <defs>
        <radialGradient id="toyHull" cx="40%" cy="30%" r="70%">
          <stop offset="0" stop-color="#ff6b6b"/><stop offset="1" stop-color="#c81d25"/>
        </radialGradient>
        <radialGradient id="toyWhite" cx="40%" cy="30%" r="70%">
          <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d6dde8"/>
        </radialGradient>
      </defs>
      <rect class="funnel" x="84" y="20" width="14" height="24" rx="7"/>
      <rect class="funnel" x="112" y="20" width="14" height="24" rx="7"/>
      <rect class="cabin" x="48" y="48" width="104" height="24" rx="12"/>
      <rect class="cabin" x="68" y="34" width="64" height="16" rx="8"/>
      <circle class="window" cx="66" cy="60" r="4"/>
      <circle class="window" cx="92" cy="60" r="4"/>
      <circle class="window" cx="118" cy="60" r="4"/>
      <circle class="window" cx="144" cy="60" r="4"/>
      <path class="hull" d="M18 70 Q100 62 182 70 Q176 102 150 104 L50 104 Q24 102 18 70 Z"/>
    </svg>
  </div>
</div>
</body>
</html>
