<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Корабль — 5) Комикс</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; }
  .stage { width: 360px; height: 640px; margin: 0 auto; position: relative; overflow: hidden; background: #fdf6e3;
    background-image: radial-gradient(#222 1.2px, transparent 1.4px); background-size: 8px 8px; }
  .panel { position: absolute; inset: 14px; border: 4px solid #000; background: #9fd3e8; overflow: hidden; }
  .city { position: absolute; bottom: 0; left: 0; width: 100%; height: 45%; }
  .ship { position: absolute; left: 50%; top: 150px; width: 220px; margin-left: -110px;
    stroke: #000; stroke-width: 4; stroke-linejoin: round;
    animation: sail 1.2s cubic-bezier(.2,1.4,.4,1) both, bob 1.8s ease-in-out 1.2s infinite; }
  .ship .hull { fill: #d7372b; }
  .ship .cabin { fill: #fff; }
  .ship .funnel { fill: #444; }
  .burst { position: absolute; top: 18px; left: 40px; width: 180px; height: 120px; transform: rotate(-8deg) scale(0);
    animation: pop 0.4s ease-out 0.9s forwards; transform-origin: center; }
  .burst text { font-family: Impact, "Arial Black", sans-serif; font-size: 26px; fill: #000; }
  @keyframes sail { from { transform: translateY(-260px); } to { transform: translateY(0); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes pop { to { transform: rotate(-8deg) scale(1); } }
  @media (prefers-reduced-motion: reduce) { .ship, .burst { animation: none; transform: none; } .burst { transform: rotate(-8deg); } }
</style>
</head>
<body>
<div class="stage">
  <div class="panel">
    <svg class="city" viewBox="0 0 300 200" preserveAspectRatio="none" aria-hidden="true">
      <rect x="10" y="90" width="50" height="110" fill="#ddd" stroke="#000" stroke-width="3"/>
      <rect x="70" y="60" width="45" height="140" fill="#ccc" stroke="#000" stroke-width="3"/>
      <rect x="125" y="100" width="60" height="100" fill="#ddd" stroke="#000" stroke-width="3"/>
      <rect x="195" y="70" width="40" height="130" fill="#ccc" stroke="#000" stroke-width="3"/>
      <rect x="245" y="110" width="50" height="90" fill="#ddd" stroke="#000" stroke-width="3"/>
    </svg>
    <svg class="ship" viewBox="0 0 200 120" aria-label="Корабль, комикс">
      <rect class="funnel" x="86" y="22" width="10" height="20"/>
      <rect class="funnel" x="112" y="22" width="10" height="20"/>
      <rect class="cabin" x="50" y="50" width="100" height="22"/>
      <rect class="cabin" x="70" y="36" width="60" height="14"/>
      <polygon class="hull" points="20,72 180,72 164,100 36,100"/>
    </svg>
    <svg class="burst" viewBox="0 0 180 120" aria-hidden="true">
      <polygon points="90,4 110,36 150,14 140,50 178,50 152,72 176,100 130,96 118,118 96,94 60,116 64,84 6,94 36,68 8,40 50,44 42,8 74,30" fill="#ffe14d" stroke="#000" stroke-width="4"/>
      <text x="90" y="72" text-anchor="middle">ШИШУХ!</text>
    </svg>
  </div>
</div>
</body>
</html>
