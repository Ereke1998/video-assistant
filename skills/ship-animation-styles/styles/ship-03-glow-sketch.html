<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Корабль — 3) Светящийся скетч</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  .stage { width: 360px; height: 640px; margin: 0 auto; position: relative; overflow: hidden; background: #000; }
  .outline { fill: none; stroke: #fff6d6; stroke-width: 1.6; stroke-linejoin: round;
    filter: drop-shadow(0 0 4px #ffd27a) drop-shadow(0 0 10px #ffb13b);
    stroke-dasharray: 500; stroke-dashoffset: 500; animation: draw 2.4s ease-out forwards; }
  .beam { fill: url(#beamGrad); opacity: 0; animation: beam 3s ease-in-out 1.2s infinite; }
  .ring { fill: none; stroke: #ffb13b; stroke-width: 1; opacity: 0.5; animation: ring 3s ease-out 1.5s infinite; transform-origin: center; }
  .wrap { animation: lift 3s cubic-bezier(.3,.7,.3,1) 2s both; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes beam { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.9; } }
  @keyframes ring { from { transform: scale(0.6); opacity: 0.6; } to { transform: scale(1.6); opacity: 0; } }
  @keyframes lift { from { transform: translateY(0); } to { transform: translateY(-60px); } }
  @media (prefers-reduced-motion: reduce) { .outline, .beam, .ring, .wrap { animation: none; stroke-dashoffset: 0; opacity: 1; } }
</style>
</head>
<body>
<div class="stage">
  <svg viewBox="0 0 360 640" width="100%" height="100%" aria-label="Корабль, светящийся скетч">
    <defs>
      <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffd27a" stop-opacity="0.9"/>
        <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <text x="180" y="60" text-anchor="middle" fill="#ffd27a" font-family="sans-serif" font-size="12" letter-spacing="6">КОРАБЛЬ</text>
    <ellipse class="ring" cx="180" cy="520" rx="60" ry="14"/>
    <ellipse class="ring" cx="180" cy="520" rx="60" ry="14" style="animation-delay:2.2s"/>
    <polygon class="beam" points="130,290 230,290 280,520 80,520"/>
    <g class="wrap">
      <path class="outline" d="M120 300 L240 300 L226 336 L134 336 Z"/>
      <path class="outline" d="M150 260 L210 260 L210 300 M150 260 L150 300"/>
      <path class="outline" d="M165 230 L195 230 L195 260 M165 230 L165 260"/>
      <path class="outline" d="M172 200 L182 200 L182 230 M172 200 L172 230 M186 200 L196 200 L196 230"/>
    </g>
    <path class="outline" d="M40 520 L320 520" style="animation-delay:1s" opacity="0.4"/>
  </svg>
</div>
</body>
</html>
