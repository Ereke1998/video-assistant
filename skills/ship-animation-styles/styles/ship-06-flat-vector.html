<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Корабль — 6) Плоский вектор</title>
<style>
  html, body { margin: 0; height: 100%; background: #f2e6d0; }
  .stage { width: 360px; height: 640px; margin: 0 auto; position: relative; overflow: hidden; background: #f2e6d0; }
  .sea { position: absolute; bottom: 0; width: 100%; height: 180px; background: #2a9d8f; }
  .ship { position: absolute; left: 50%; top: 210px; width: 220px; margin-left: -110px;
    animation: sail 2.4s cubic-bezier(.16,1,.3,1) both, bob 2.2s ease-in-out 2.4s infinite; }
  .ship .hull { fill: #e76f51; }
  .ship .cabin { fill: #fefae0; }
  .ship .funnel { fill: #264653; }
  .ship .window { fill: #f4a261; }
  .sun { position: absolute; top: 70px; left: 240px; width: 70px; height: 70px; border-radius: 50%; background: #e9c46a;
    animation: sunrise 2.4s ease-out both; }
  @keyframes sail { from { transform: translateX(-340px); } to { transform: translateX(0); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes sunrise { from { transform: translateY(40px); } to { transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { .ship, .sun { animation: none; } }
</style>
</head>
<body>
<div class="stage">
  <div class="sun"></div>
  <div class="sea"></div>
  <svg class="ship" viewBox="0 0 200 120" aria-label="Корабль, плоский вектор">
    <rect class="funnel" x="86" y="22" width="10" height="20" rx="2"/>
    <rect class="funnel" x="112" y="22" width="10" height="20" rx="2"/>
    <rect class="cabin" x="50" y="50" width="100" height="22" rx="3"/>
    <rect class="cabin" x="70" y="36" width="60" height="14" rx="3"/>
    <rect class="window" x="60" y="57" width="10" height="7" rx="1"/>
    <rect class="window" x="95" y="57" width="10" height="7" rx="1"/>
    <rect class="window" x="130" y="57" width="10" height="7" rx="1"/>
    <path class="hull" d="M20 72 L180 72 L162 100 L38 100 Z"/>
  </svg>
</div>
</body>
</html>
