<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude: что это — превью</title>
  <style>
    html, body { margin: 0; background: #050507; color: #ddd; font: 14px Inter, Arial, sans-serif; }
    body.render canvas { width: 1080px; height: 1920px; }
    .wrap { display: flex; gap: 20px; padding: 16px; align-items: flex-start; flex-wrap: wrap; }
    canvas { height: calc(100vh - 32px); max-width: 100%; aspect-ratio: 9 / 16; background: #000; border-radius: 12px; }
    .panel { display: flex; flex-direction: column; gap: 10px; min-width: 260px; }
    input[type=range] { width: 100%; }
    button { background: #222; color: #fff; border: 1px solid #444; border-radius: 8px; padding: 6px 10px; cursor: pointer; text-align: left; }
    #jumps { display: flex; flex-direction: column; gap: 6px; }
  </style>
</head>
<body>
  <script>if (location.search.includes('render')) document.body.className = 'render';</script>
  <div class="wrap">
    <canvas id="c"></canvas>
    <div class="panel" id="panel">
      <button id="play">▶ / ❚❚ (со звуком, если собран build/mix.wav)</button>
      <input id="scrub" type="range" min="0" max="38" step="0.001" value="0">
      <div id="info"></div>
      <label><input type="checkbox" id="safe"> показать безопасные зоны Reels/Shorts</label>
      <div id="jumps"></div>
      <audio id="audio" preload="auto"></audio>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
