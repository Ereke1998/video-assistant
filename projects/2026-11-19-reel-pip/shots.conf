# Общий список планов для build_video.sh / build_sound.sh
# План: исходник играет до момента совпадения с картинкой «ПОСЛЕ» → шторка → «ПОСЛЕ» продолжает двигаться
# (anim_N.mp4 из animate_after.py: интерьер следует за камерой, героиня — живая из исходника).
# Можно указать и картинку after_N.png — тогда стоп-кадр + наезд.
# Моменты совпадения подобраны align_after.py (after/align.json): старт = момент − PRE.
PRE=1.5            # сколько секунд «ДО» играет видео до замирания
REVEAL_DUR=0.7     # шторка
HOLD=1.0           # (для режима картинок) «ПОСЛЕ» после шторки
#        старт(src)  длит.  проявление(с от начала плана | -)  картинка «ПОСЛЕ» | -   описание
SHOTS=( "147.5    2.4  -    -                  вид из окна, заголовок"
        "73.6     3.2  1.5  after/anim_2.mp4   вход в гостиную (img2, совпадение 75.100)"
        "127.767  3.2  1.5  after/anim_1.mp4   коридор (img1, совпадение 129.267)"
        "16.8     3.2  1.5  after/anim_3.mp4   общий план гостиной (img3, совпадение 18.300)"
        "143.1    2.4  1.5  after/anim_4.mp4   эркер с окном (img4, совпадение 144.600; героиня уходит из кадра — «после» 0.9 с)"
        "183.533  3.6  1.5  after/anim_5.mp4   комната с эркером (img5, совпадение 185.033)" )
TITLE=${TITLE:-ДО / ПОСЛЕ}
SRC=${SRC:-/tmp/work/src/src.mp4}
# вывод: «старт_в_ролике длит. проявление картинка»
shot_starts(){ local t=0; for s in "${SHOTS[@]}"; do set -- $s; echo "$t $2 $3 $4"; t=$(awk -v a=$t -v b=$2 'BEGIN{print a+b}'); done; }
