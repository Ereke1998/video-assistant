# Общий список планов для build_base.sh / compose_reveal.sh / build_sound.sh
# Каждый план: «ДО» (черновая) → шторка → «ПОСЛЕ» (готовый интерьер, ИИ-клип shotN).
#        начало в исходнике  длит.  описание
SHOTS=( "147.5 3 вид из окна: небо, город"
        "72.5  3 вход в комнату, героиня уходит вглубь"
        "127.0 3 коридор"
        "17.0  3 общий план большой комнаты"
        "143.0 3 эркер с окном"
        "184.0 3 общий план, героиня в комнате" )
REVEAL_AT=${REVEAL_AT:-1.0}     # через сколько секунд после начала плана стартует проявление
REVEAL_DUR=${REVEAL_DUR:-0.7}   # длительность шторки
TITLE=${TITLE:-ДО / ПОСЛЕ}      # заголовок на первом плане
SRC=${SRC:-/tmp/work/src/src.mp4}
STYLE=${STYLE:-/tmp/work/style/style.mp4}
AI_OUT=${AI_OUT:-/tmp/work/ai_output}   # сюда класть готовые ИИ-клипы: shot1.mp4 … shot6.mp4 (или .png/.jpg)
# старты планов в ролике
shot_starts(){ local t=0; for s in "${SHOTS[@]}"; do set -- $s; echo "$t $2"; t=$(awk -v a=$t -v b=$2 'BEGIN{print a+b}'); done; }
