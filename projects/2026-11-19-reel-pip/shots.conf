# Общий список планов для build_video.sh / build_sound.sh
# План: исходник играет до момента совпадения с картинкой «ПОСЛЕ» → стоп-кадр → шторка → «ПОСЛЕ» + наезд.
# Моменты совпадения подобраны align_after.py (after/align.json): старт = момент − PRE.
PRE=1.5            # сколько секунд «ДО» играет видео до замирания
REVEAL_DUR=0.7     # шторка
HOLD=1.0           # «ПОСЛЕ» после шторки
#        старт(src)  длит.  проявление(с от начала плана | -)  картинка «ПОСЛЕ» | -   описание
SHOTS=( "147.5    2.0  -    -                  вид из окна, заголовок"
        "73.6     3.2  1.5  after/after_2.png  вход в гостиную (img2, совпадение 75.100)"
        "127.767  3.2  1.5  after/after_1.png  коридор (img1, совпадение 129.267)"
        "16.8     3.2  1.5  after/after_3.png  общий план гостиной (img3, совпадение 18.300)"
        "143.1    3.2  1.5  after/after_4.png  эркер с окном (img4, совпадение 144.600)"
        "183.533  3.2  1.5  after/after_5.png  комната с эркером (img5, совпадение 185.033)" )
TITLE=${TITLE:-ДО / ПОСЛЕ}
SRC=${SRC:-/tmp/work/src/src.mp4}
# вывод: «старт_в_ролике длит. проявление картинка»
shot_starts(){ local t=0; for s in "${SHOTS[@]}"; do set -- $s; echo "$t $2 $3 $4"; t=$(awk -v a=$t -v b=$2 'BEGIN{print a+b}'); done; }
